server:
  port: 0

spring:
  application:
    name: order-shred-test
  datasource:
    # TestContainers will override these values
    url: jdbc:mysql://localhost:3306/test_orders
    username: test
    password: test
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  activemq:
    # TestContainers will override these values
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
    packages:
      trust-all: true
    pool:
      enabled: true
      max-connections: 5

grpc:
  server:
    port: 0
    address: 0.0.0.0

payment:
  service:
    # WireMock will provide this URL
    url: http://localhost:8089
    connect-timeout: 5000
    read-timeout: 5000

inventory:
  service:
    # WireMock will provide this host/port
    host: localhost
    port: 9091

resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5000
        permittedNumberOfCallsInHalfOpenState: 2
        registerHealthIndicator: true
        allowHealthIndicatorToFail: true
  retry:
    instances:
      paymentService:
        maxAttempts: 2
        waitDuration: 500
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

spring:
  retry:
    maxAttempts: 2
    initialInterval: 500
    multiplier: 2
    maxInterval: 2000

logging:
  level:
    root: INFO
    ai.shreds: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    io.github.resilience4j: DEBUG
    org.testcontainers: INFO
    com.github.tomakehurst.wiremock: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always